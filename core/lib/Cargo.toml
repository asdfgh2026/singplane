[package]
name = "singpanel-core"
version = "0.1.0"
edition = "2021"
description = "Shared SingPanel control plane (assemble/fetch/convert/check/engine). Not a sing-box fork."
publish = false

[lib]
name = "singpanel_core"
path = "src/lib.rs"

[dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
getrandom = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
