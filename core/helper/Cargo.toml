[package]
name = "singpanel-helper"
version = "0.1.0"
edition = "2021"
description = "Elevated Windows helper service for SingPanel."
publish = false

[[bin]]
name = "singpanel-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_EventLog",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

