[package]
name = "singpanel-host"
version = "0.1.0"
edition = "2021"
description = "HTTP shell around singpanel-core for desktop GPUI."
publish = false

[dependencies]
singpanel-core = { path = "../lib" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
getrandom = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
