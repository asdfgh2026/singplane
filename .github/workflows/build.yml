name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SingPanel release version"
        required: false
        default: "0.1.0"
        type: string
      sing_box_version:
        description: "Official sing-box version"
        required: false
        default: "v1.13.19"
        type: string
      create_release:
        description: "Publish to GitHub Releases"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      sing_box_version: ${{ steps.out.outputs.sing_box_version }}
      create_release: ${{ steps.out.outputs.create_release }}
      prerelease: ${{ steps.out.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version / tag
        id: out
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "Tag ${{ github.ref_name }} is not on origin/main" >&2
              exit 1
            fi
            tag="${{ github.ref_name }}"
            ver="${tag#v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "sing_box_version=v1.13.19" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            if [[ "${ver}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "sing_box_version=${{ inputs.sing_box_version }}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # 1. Android APK (Jetpack Compose + official libbox.aar)
  # =========================================================================
  build-android:
    name: Android (Compose APK)
    needs: meta
    runs-on: ubuntu-latest
    env:
      SINGPANEL_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build libbox.aar (Multi-Arch)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_TARGET_ABIS: "android/arm,android/arm64,android/386,android/amd64"
        run: |
          chmod +x ./scripts/build_android.sh
          ./scripts/build_android.sh "${{ needs.meta.outputs.sing_box_version }}" --debug

      - name: Assemble APKs
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PappVersion=${{ needs.meta.outputs.version }}

      - name: Package Android Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ needs.meta.outputs.version }}"
          
          # Find generated debug APKs
          for apk in mobile/app/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ]; then
              cp -f "$apk" "dist/SingPanel-${VER}-android-debug.apk"
            fi
          done
          
          ls -lah dist

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singpanel-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 2. macOS Desktop (GPUI Shell - arm64 & x86_64)
  # =========================================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: meta
    env:
      SINGPANEL_VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            go_arch: arm64
            sb_arch: darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            arch: x64
            go_arch: amd64
            sb_arch: darwin-amd64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download official sing-box binary
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.sing_box_version }}"
          RAW_VER="${TAG#v}"
          mkdir -p cores
          
          URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${RAW_VER}-${{ matrix.sb_arch }}.tar.gz"
          echo "Downloading sing-box from ${URL}..."
          curl -sSL "${URL}" | tar -xz --strip-components=1 -C cores/
          chmod +x cores/sing-box
          # macos-14 runners are arm64; do not execute a darwin-amd64 core here.
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            cores/sing-box version
          else
            echo "Skip running ${{ matrix.arch }} sing-box on this runner"
            ls -lh cores/sing-box
          fi

      - name: Build Go Convert Sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd core/convert
          GOARCH="${{ matrix.go_arch }}" go build -ldflags="-s -w" -o singpanel-convert .
          chmod +x singpanel-convert

      - name: Build Rust Host
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path core/host/Cargo.toml --target ${{ matrix.target }}

      - name: Build GPUI Desktop Shell
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path desktop/Cargo.toml --target ${{ matrix.target }}

      - name: Package macOS App Bundle & DMG
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          APP="dist/SingPanel.app"
          ICONSET="dist/AppIcon.iconset"
          
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$ICONSET"
          
          # Generate ICNS
          PNG="desktop/assets/app_icon.png"
          sips -z 16 16     "$PNG" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32     "$PNG" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     "$PNG" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64     "$PNG" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   "$PNG" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256   "$PNG" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   "$PNG" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512   "$PNG" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   "$PNG" --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$PNG" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"
          
          # Copy Plist & binaries
          cp desktop/macos/Info.plist "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$APP/Contents/Info.plist"
          cp desktop/macos/SingPanel-launch "$APP/Contents/MacOS/SingPanel"
          cp "desktop/target/${{ matrix.target }}/release/singpanel-gpui" "$APP/Contents/MacOS/singpanel-gpui"
          cp "core/host/target/${{ matrix.target }}/release/singpanel-host" "$APP/Contents/MacOS/singpanel-host"
          cp core/convert/singpanel-convert "$APP/Contents/MacOS/singpanel-convert"
          cp cores/sing-box "$APP/Contents/MacOS/sing-box"
          
          chmod 755 "$APP/Contents/MacOS/"*
          
          # Ad-hoc codesign
          xattr -cr "$APP" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"
          
          # Package DMG & ZIP
          hdiutil create -volname "SingPanel" -srcfolder "$APP" -ov -format UDZO "dist/SingPanel-${VER}-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/SingPanel-${VER}-macos-${{ matrix.arch }}.zip"
          
          rm -rf "$APP"
          ls -lah dist

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singpanel-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 3. Windows Desktop (GPUI Shell - x64 & arm64)
  # =========================================================================
  build-windows:
    name: Windows (${{ matrix.arch }})
    needs: meta
    env:
      SINGPANEL_VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            go_arch: amd64
            sb_arch: windows-amd64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            go_arch: arm64
            sb_arch: windows-arm64
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download official sing-box binary
        shell: pwsh
        run: |
          $tag = "${{ needs.meta.outputs.sing_box_version }}"
          $rawVer = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path cores | Out-Null
          $url = "https://github.com/SagerNet/sing-box/releases/download/$tag/sing-box-$rawVer-${{ matrix.sb_arch }}.zip"
          Write-Host "Downloading sing-box from $url..."
          Invoke-WebRequest -Uri $url -OutFile "cores\sing-box.zip"
          Expand-Archive "cores\sing-box.zip" -DestinationPath "cores\temp"
          Get-ChildItem -Path "cores\temp\*\sing-box.exe" | Move-Item -Destination "cores\sing-box.exe" -Force
          Remove-Item "cores\temp", "cores\sing-box.zip" -Recurse -Force
          Get-Item "cores\sing-box.exe" | Format-List Name, Length
          # windows-latest is x64; do not execute a cross-built arm64 core here.
          if ("${{ matrix.arch }}" -eq "x64") {
            & "cores\sing-box.exe" version
          } else {
            Write-Host "Skip running ${{ matrix.arch }} sing-box on this runner"
          }

      - name: Build Go Convert Sidecar
        shell: pwsh
        run: |
          cd core\convert
          $env:GOARCH = "${{ matrix.go_arch }}"
          go build -ldflags="-s -w" -o singpanel-convert.exe .

      - name: Build Windows Helper Service
        shell: pwsh
        run: |
          if (-not (Test-Path "core\helper\Cargo.toml")) {
            throw "core/helper/Cargo.toml missing (Rust helper crate required)"
          }
          $targetDir = "core\helper\target"
          cargo build --release --manifest-path core/helper/Cargo.toml --target ${{ matrix.target }} --target-dir $targetDir
          $exe = Join-Path $targetDir "${{ matrix.target }}\release\singpanel-helper.exe"
          if (-not (Test-Path $exe)) {
            throw "helper build output missing: $exe"
          }

      - name: Build Rust Host
        shell: pwsh
        run: |
          cargo build --release --manifest-path core/host/Cargo.toml --target ${{ matrix.target }}

      - name: Build GPUI Desktop Shell
        shell: pwsh
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml --target ${{ matrix.target }}

      - name: Package Windows Zip Bundle
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist\SingPanel | Out-Null
          
          Copy-Item "desktop\target\${{ matrix.target }}\release\singpanel-gpui.exe" "dist\SingPanel\SingPanel.exe"
          Copy-Item "core\host\target\${{ matrix.target }}\release\singpanel-host.exe" "dist\SingPanel\singpanel-host.exe"
          $helper = "core\helper\target\${{ matrix.target }}\release\singpanel-helper.exe"
          if (-not (Test-Path $helper)) {
            throw "package: missing helper at $helper"
          }
          Copy-Item $helper "dist\SingPanel\singpanel-helper.exe"
          Copy-Item "core\convert\singpanel-convert.exe" "dist\SingPanel\singpanel-convert.exe"
          Copy-Item "cores\sing-box.exe" "dist\SingPanel\sing-box.exe"
          
          $zip = "dist\SingPanel-$ver-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "dist\SingPanel\*" -DestinationPath $zip -Force
          Remove-Item "dist\SingPanel" -Recurse -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singpanel-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 4. GitHub Release (Optional)
  # =========================================================================
  release:
    name: Publish GitHub Release
    if: ${{ always() && needs.meta.result == 'success' && needs.meta.outputs.create_release == 'true' }}
    needs:
      - meta
      - build-android
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download successful artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: singpanel-*
          merge-multiple: true
          if-no-files-found: ignore

      - name: Collect Release Assets & Generate Checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.apk' -o -name '*.zip' -o -name '*.dmg' \
          \) -print -exec cp -f {} release-assets/ \;

          shopt -s nullglob
          assets=(release-assets/*.apk release-assets/*.zip release-assets/*.dmg)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No successful build artifacts to publish" >&2
            exit 1
          fi

          {
            echo "### Build matrix"
            echo
            echo "- Android: \`${{ needs.build-android.result }}\`"
            echo "- macOS: \`${{ needs.build-macos.result }}\`"
            echo "- Windows: \`${{ needs.build-windows.result }}\`"
            echo
            echo "Only platforms that finished successfully are attached."
          } > release-body.md

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.meta.outputs.version }}"
          name: "SingPanel v${{ needs.meta.outputs.version }}"
          body_path: release-body.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
